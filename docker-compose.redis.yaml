services:
  ui:
    environment:
      SESSION_BACKEND: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USE_TLS: "false"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: docker.io/library/redis:7-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [
        "CMD-SHELL",
        "redis-cli ping | grep PONG",
      ]
      interval: 5s
      timeout: 3s
      retries: 10
