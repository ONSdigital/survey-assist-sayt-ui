steps:
  - name: gcr.io/$PROJECT_ID/testrunner
    secretEnv: ['TEST_E2E_USERNAME', 'TEST_E2E_PASSWORD']
    args:
      - '-c'
      - |
        set -e
        echo === Looking up config from parameter store ===
        dev_config=$(gcloud parametermanager parameters versions describe dev --parameter=infra-test-config --location=global --project $PROJECT_ID --format='value(payload.data)' | base64 --decode)
        SAYT_UI_IMAGE_DEV=$(echo $dev_config | jq -er '."cr-sayt-ui-image"')

        preprod_config=$(gcloud parametermanager parameters versions describe preprod --parameter=infra-test-config --location=global --project $PROJECT_ID --format='value(payload.data)' | base64 --decode)
        SAYT_UI_IMAGE_RELEASES=$(echo $preprod_config | jq -er '."cr-sayt-ui-image"')
        TARGET_PROJECT_ID=$(echo $preprod_config | jq -er '."project-id"')
        export PROXY_API_URL=$(echo $preprod_config | jq -er '."proxy-api-url"')

        echo === Pulling image dev image with tag $SHORT_SHA ===
        docker pull $$SAYT_UI_IMAGE_DEV:$SHORT_SHA

        echo === Build Docker image, tag and push to GAR ===
        docker tag $$SAYT_UI_IMAGE_DEV:$SHORT_SHA $$SAYT_UI_IMAGE_RELEASES:$TAG_NAME
        docker tag $$SAYT_UI_IMAGE_DEV:$SHORT_SHA $$SAYT_UI_IMAGE_RELEASES:latest
        docker push $$SAYT_UI_IMAGE_RELEASES:$TAG_NAME
        docker push $$SAYT_UI_IMAGE_RELEASES:latest

        echo === Deploy SAYT UI ===
        gcloud run deploy sayt-ui --image=$$SAYT_UI_IMAGE_RELEASES:$TAG_NAME --region $LOCATION --project $$TARGET_PROJECT_ID

        echo === Run smoke tests ===

        export TARGET_ENVIRONMENT=$_ENV_NAME
        export UI_SA_ID_TOKEN=$(gcloud auth print-identity-token) # Use CICD service account
        export SAYT_UI_URL=$$PROXY_API_URL # set to proxy API
        poetry run pytest -s cicd

        echo === Run E2E tests ===

        # TEST_E2E_USERNAME and TEST_E2E_PASSWORD are exported by the secret manager
        export TEST_E2E_BASE_URL=$$SAYT_UI_URL
        export CONTAINER_ENGINE=docker
        make e2e-tests

    id: Tag and push release image
    entrypoint: bash
timeout: 2000s
options:
  logging: CLOUD_LOGGING_ONLY
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/sayt-ui-e2e-username-${_ENV_NAME}/versions/latest
      env: TEST_E2E_USERNAME
    - versionName: projects/$PROJECT_ID/secrets/sayt-ui-e2e-password-${_ENV_NAME}/versions/latest
      env: TEST_E2E_PASSWORD
