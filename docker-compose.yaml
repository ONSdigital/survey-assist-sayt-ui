services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: survey-assist-sayt-ui:local
    env_file:
      - .env
    environment:
      AUTH_MODE: local
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
      SESSION_BACKEND: client
      SESSION_COOKIE_SECURE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./users.json
        target: /app/users.json
        read_only: true
      - type: bind
        source: ${CRED_FILE:?Set CRED_FILE to the absolute path of your Google credentials file}
        target: /run/secrets/gcp-key.json
        read_only: true

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
