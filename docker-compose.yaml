services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: survey-assist-sayt-ui:local
    env_file:
      - .env
    environment:
      AUTH_MODE: local
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-key.json
      SESSION_BACKEND: client
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ./users.json
        target: /app/users.json
        read_only: true
      - type: bind
        source: ${CRED_FILE:?Set CRED_FILE to the absolute path of your Google credentials file}
        target: /run/secrets/gcp-key.json
        read_only: true
